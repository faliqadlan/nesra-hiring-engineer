<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Nesra Weekly Report Cache — Official Benchmark Scan Cost Breakdown</title>
  <desc id="desc">Stacked bar chart showing Phase 1 scan cost of Rp 11,308.15 (226,163 rows) and Phase 2 delta scan cost of Rp 3,197.80 (63,956 rows), totaling Rp 14,505.95 (72.53% of the Rp 20,000 budget), leaving Rp 5,494.05 (27.47%) remaining budget headroom.</desc>

  <!-- Outer Card Background (high contrast on both GitHub Light and Dark themes) -->
  <rect x="2" y="2" width="756" height="316" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
    Official Benchmark Scan Cost vs. Rp 20,000 Budget
  </text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
    Measured via measure.py on fresh service (rate: Rp 0.05 / raw row scanned • startup precompute: Rp 0.00)
  </text>

  <!-- Status Pill -->
  <rect x="572" y="22" width="156" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="650" y="40" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">
    PASS • -27.47% vs Cap
  </text>

  <!-- Stacked Bar Chart Track (x=32 to x=712, total width = 680px = Rp 20,000) -->
  <!-- Phase 1: Rp 11,308.15 = 56.54075% = 384.48px (x=32 to 416.48) -->
  <!-- Phase 2: Rp 3,197.80  = 15.98900% = 108.73px (x=416.48 to 525.20) -->
  <!-- Remaining: Rp 5,494.05 = 27.47025% = 186.80px (x=525.20 to 712.00) -->

  <!-- Background Track (Remaining Budget) -->
  <rect x="32" y="86" width="680" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Phase 1 Bar -->
  <rect x="32" y="86" width="384.48" height="38" rx="6" fill="#2563eb"/>
  <rect x="410" y="86" width="6.48" height="38" fill="#2563eb"/>

  <!-- Phase 2 Bar -->
  <rect x="416.48" y="86" width="108.72" height="38" fill="#f59e0b"/>

  <!-- In-Bar Labels -->
  <text x="224" y="109" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
    Phase 1: Rp 11,308.15 (56.5%)
  </text>
  <text x="471" y="109" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">
    P2: Rp 3,197.80
  </text>
  <text x="618" y="109" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    Headroom: Rp 5,494.05
  </text>

  <!-- Total Marker Line at x=525.20 (Rp 14,505.95) -->
  <line x1="525.2" y1="78" x2="525.2" y2="132" stroke="#38bdf8" stroke-width="2"/>
  <text x="525.2" y="74" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
    Total: Rp 14,505.95 (72.53%)
  </text>

  <!-- Budget Ceiling Line at x=712 (Rp 20,000) -->
  <line x1="712" y1="78" x2="712" y2="132" stroke="#f43f5e" stroke-width="2"/>
  <text x="712" y="74" text-anchor="end" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
    Budget Cap: Rp 20,000
  </text>

  <!-- Scale Ticks -->
  <text x="32" y="144" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp 0</text>
  <text x="202" y="144" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp 5,000</text>
  <text x="372" y="144" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp 10,000</text>
  <text x="712" y="144" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp 20,000</text>

  <!-- Metric Breakdown Cards -->
  <!-- Card 1: Phase 1 -->
  <rect x="32" y="162" width="218" height="94" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="48" cy="181" r="5" fill="#2563eb"/>
  <text x="60" y="185" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    Phase 1 • Cold Partition Scans
  </text>
  <text x="44" y="210" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">
    Rp 11,308.15
  </text>
  <text x="44" y="229" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">
    226,163 base rows (W07–W12 dates)
  </text>
  <text x="44" y="245" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">
    7,500 requests • 100% accuracy
  </text>

  <!-- Card 2: Phase 2 -->
  <rect x="263" y="162" width="224" height="94" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="279" cy="181" r="5" fill="#f59e0b"/>
  <text x="291" y="185" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    Phase 2 • Delta Refresh
  </text>
  <text x="275" y="210" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">
    Rp 3,197.80
  </text>
  <text x="275" y="229" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">
    17,458 delta + 46,498 base rows
  </text>
  <text x="275" y="245" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">
    6,000 post-delta reqs @ Rp 0.00
  </text>

  <!-- Card 3: Lifetime Summary -->
  <rect x="500" y="162" width="228" height="94" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
  <circle cx="516" cy="181" r="5" fill="#38bdf8"/>
  <text x="528" y="185" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    Lifetime Total &amp; Headroom
  </text>
  <text x="512" y="210" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">
    Rp 14,505.95
  </text>
  <text x="512" y="229" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
    Remaining: Rp 5,494.05 (27.47%)
  </text>
  <text x="512" y="245" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">
    290,119 total rows • 0 stale keys
  </text>

  <!-- Footer Comparison Note (Explicitly marked as Workload Estimate) -->
  <rect x="32" y="268" width="696" height="34" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="46" y="289" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
    <tspan fill="#fbbf24" font-weight="700">Analytical Estimate (Uncached Baseline):</tspan>
    13,500 requests × ~81,000 rows (14 days/req) ≈
    <tspan fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600">Rp 54,675,000</tspan>
    →
    <tspan fill="#34d399" font-weight="700">99.97% scan cost reduction</tspan>
  </text>
</svg>
