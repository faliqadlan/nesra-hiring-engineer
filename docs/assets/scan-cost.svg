<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Nesra Weekly Report Cache — Rincian Biaya Pemindaian Data vs. Anggaran</title>
  <desc id="desc">Grafik batang bertumpuk yang menampilkan biaya pemindaian Fase 1 sebesar Rp11.308,15 (226.163 baris) dan Fase 2 pembaruan delta sebesar Rp3.197,80 (63.956 baris), dengan total biaya Rp14.505,95 (72,53% dari anggaran Rp20.000) dan sisa anggaran Rp5.494,05 (27,47%).</desc>

  <!-- Latar Kartu Utama (kontras tinggi pada mode terang maupun gelap GitHub) -->
  <rect x="2" y="2" width="756" height="332" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="36" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Biaya Pemindaian Data vs. Anggaran (Rp20.000)</text>
  <text x="32" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Diukur dengan measure.py pada layanan baru (tarif Rp0,05/baris • precompute saat startup: Rp0,00)</text>

  <!-- Lencana Status -->
  <rect x="572" y="20" width="156" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="650" y="38" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">LULUS • Sisa 27,47%</text>

  <!-- Jalur Grafik Batang (x=32 s.d. x=712, lebar total = 680px = Rp20.000) -->
  <!-- Fase 1: Rp11.308,15 = 56,54075% = 384,48px (x=32 s.d. 416,48) -->
  <!-- Fase 2: Rp3.197,80  = 15,98900% = 108,72px (x=416,48 s.d. 525,20) -->
  <!-- Sisa:   Rp5.494,05  = 27,47025% = 186,80px (x=525,20 s.d. 712,00) -->

  <!-- Latar Jalur (Sisa Anggaran) -->
  <rect x="32" y="92" width="680" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Batang Fase 1 -->
  <rect x="32" y="92" width="384.48" height="38" rx="6" fill="#2563eb"/>
  <rect x="410" y="92" width="6.48" height="38" fill="#2563eb"/>

  <!-- Batang Fase 2 -->
  <rect x="416.48" y="92" width="108.72" height="38" fill="#f59e0b"/>

  <!-- Label di Dalam Batang -->
  <text x="224" y="115" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Fase 1: Rp11.308,15 (56,5%)</text>
  <text x="470.8" y="115" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">F2: Rp3.197,80</text>
  <text x="618.6" y="115" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">Sisa: Rp5.494,05</text>

  <!-- Garis Penanda Total Biaya di x=525.20 (Rp14.505,95) -->
  <line x1="525.2" y1="74" x2="525.2" y2="136" stroke="#38bdf8" stroke-width="2"/>
  <text x="518" y="82" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Total Biaya: Rp14.505,95 (72,53%)</text>

  <!-- Garis Batas Anggaran di x=712 (Rp20.000) -->
  <line x1="712" y1="74" x2="712" y2="136" stroke="#f43f5e" stroke-width="2"/>
  <text x="705" y="82" text-anchor="end" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Batas: Rp20.000</text>

  <!-- Skala Sumbu -->
  <text x="32" y="149" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp0</text>
  <text x="202" y="149" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp5.000</text>
  <text x="372" y="149" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp10.000</text>
  <text x="525.2" y="149" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp14,5rb</text>
  <text x="712" y="149" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Rp20.000</text>

  <!-- Kartu Rincian Metrik -->
  <!-- Kartu 1: Fase 1 -->
  <rect x="32" y="164" width="218" height="94" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="48" cy="183" r="5" fill="#2563eb"/>
  <text x="58" y="187" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Fase 1 — Materialisasi Awal</text>
  <text x="44" y="212" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">Rp11.308,15</text>
  <text x="44" y="231" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">226.163 baris base (W07–W12)</text>
  <text x="44" y="247" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">7.500 request • akurasi 100%</text>

  <!-- Kartu 2: Fase 2 -->
  <rect x="263" y="164" width="224" height="94" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="279" cy="183" r="5" fill="#f59e0b"/>
  <text x="289" y="187" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Fase 2 — Pembaruan Delta</text>
  <text x="275" y="212" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">Rp3.197,80</text>
  <text x="275" y="231" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">17.458 baris delta + 46.498 base</text>
  <text x="275" y="247" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">6.000 request cache @ Rp0,00</text>

  <!-- Kartu 3: Total & Sisa Anggaran -->
  <rect x="500" y="164" width="228" height="94" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
  <circle cx="516" cy="183" r="5" fill="#38bdf8"/>
  <text x="526" y="187" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Total Biaya &amp; Sisa Anggaran</text>
  <text x="512" y="212" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">Rp14.505,95</text>
  <text x="512" y="231" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Sisa: Rp5.494,05 (27,47%)</text>
  <text x="512" y="247" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">290.119 total baris • 0 stale key</text>

  <!-- Catatan Perbandingan Bawah (Dua baris agar aman di dalam lebar kotak 696px) -->
  <rect x="32" y="270" width="696" height="48" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="46" y="289" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Estimasi Tanpa Cache (Perhitungan Analitis Berdasarkan Asumsi Beban Kerja, Bukan Pengukuran Benchmark):</text>
  <text x="46" y="307" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">13.500 request × ~81.000 baris/request (14 hari) ≈ <tspan fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600">Rp54.675.000</tspan> vs. <tspan fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600">Rp14.505,95</tspan> terukur (<tspan fill="#34d399" font-weight="700">hemat 99,97%</tspan>)</text>
</svg>
